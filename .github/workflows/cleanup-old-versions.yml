name: Remove superseded watchface builds
on:
  push:
    paths:
      - '.github/workflows/cleanup-old-versions.yml'
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete versions 1.9 through 2.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 37123537554 37123147880 37122594940 37122010738; do
            gh api --method DELETE repos/lepilinvitold-boop/Amazfit-watchfaces/actions/runs/$run
          done
