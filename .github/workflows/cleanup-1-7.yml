name: Remove failed 1.7 build
on:
  push:
    paths: ['.github/workflows/cleanup-1-7.yml']
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete failed version artifact and run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE repos/lepilinvitold-boop/Amazfit-watchfaces/actions/artifacts/11273326574
          gh api --method DELETE repos/lepilinvitold-boop/Amazfit-watchfaces/actions/runs/37120271527
